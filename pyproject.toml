[project]
name = "fraudes-diners"
version = "0.1.0"
description = "Modelos para detección de fraudes"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "boto3>=1.28.0",
    "awscli>=1.29.0",
    "s3fs>=0.4.2",
    "loguru>=0.7.3",
    "uvicorn>=0.40.0",
    "fastapi>=0.128.0",
    "ngrok>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
